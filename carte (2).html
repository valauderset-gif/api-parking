<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte des places libres</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{ --ink:#1c2426; --ink-soft:#5b6b6e; --paper:#f5f3ee; --card:#ffffff; --line:#dfe0d8;
  --ok:#1a8f4c; --warn:#b76e00; --full:#c62828; --hover:#f0f1ec; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#eef1f0; --ink-soft:#a9b6b4; --paper:#141a19; --card:#1c2422; --line:#2b332f; --ok:#5fd694; --warn:#f0b04a; --full:#ff7b7b; --hover:#232c2a; } }
:root[data-theme="dark"]{ --ink:#eef1f0; --ink-soft:#a9b6b4; --paper:#141a19; --card:#1c2422; --line:#2b332f; --ok:#5fd694; --warn:#f0b04a; --full:#ff7b7b; --hover:#232c2a; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
.wrap{ max-width:900px; margin:0 auto; padding:16px; }
#carte{ height:420px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.mini-list{ margin-top:16px; border:1px solid var(--line); background:var(--card); border-radius:12px; overflow:hidden; }
.table-scroll{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13.5px; }
thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:10px 16px; border-bottom:1px solid var(--line); white-space:nowrap; }
tbody td{ padding:10px 16px; border-bottom:1px solid var(--line); }
tbody tr{ cursor:pointer; }
tbody tr:hover{ background:var(--hover); }
tbody tr:last-child td{ border-bottom:none; }
.ml-name{ font-weight:600; }
.pastille{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle; background:#888; }
.ml-libres{ font-weight:700; color:var(--ink-soft); white-space:nowrap; }
.disponible .ml-libres{ color:var(--ok); } .disponible .pastille{ background:var(--ok); }
.presque .ml-libres{ color:var(--warn); } .presque .pastille{ background:var(--warn); }
.complet .ml-libres{ color:var(--full); } .complet .pastille{ background:var(--full); }
.maj{ font-size:11px; color:var(--ink-soft); padding:8px 16px; border-top:1px solid var(--line); }
.onglets{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.onglets button{ font:inherit; font-size:13px; padding:6px 14px; border-radius:999px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); cursor:pointer; }
.onglets button.actif{ background:var(--ink); color:var(--card); border-color:var(--ink); }
.onglets:empty{ display:none; }
.maj a{ color:inherit; }
.ml-ville{ color:var(--ink-soft); font-size:12px; font-weight:400; margin-left:6px; }
.popup-nom{ font-weight:700; font-size:14px; }
.popup-libres{ font-size:18px; font-weight:700; margin-top:4px; }
.marqueur{ background:none; border:none; }
.marqueur div{ width:34px; height:34px; border-radius:50%; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4);
  color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; }
@media (max-width:600px){ #carte{ height:320px; } tbody td, thead th{ padding:8px 10px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="onglets" id="onglets"></div>
  <div id="carte"></div>
  <div class="mini-list">
    <div class="table-scroll">
      <table>
        <thead><tr><th>Parking</th><th>Nombre de places</th><th>Places libres</th></tr></thead>
        <tbody id="lignes"><tr><td colspan="3">Chargement…</td></tr></tbody>
      </table>
    </div>
    <div class="maj" id="maj">Connexion en cours…</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const COULEURS = { "disponible": "#1a8f4c", "presque complet": "#e08a00", "complet": "#c62828", "inconnu": "#888888" };
  const classe = (s) => s === "disponible" ? "disponible" : s === "presque complet" ? "presque" : s === "complet" ? "complet" : "";
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const carte = L.map("carte", { scrollWheelZoom: false }).setView([46.8036, 7.1520], 15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(carte);

  const data = {}, marqueurs = {};
  const params = new URLSearchParams(location.search);
  let villeChoisie = params.get("ville") || "";   // "" = toutes les villes
  const villeFixe = params.has("ville");            // ?ville=... : pas d'onglets
  const norm = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
  const visible = (p) => !villeChoisie || norm(p.ville) === norm(villeChoisie);

  function icone(p) {
    const c = COULEURS[p.statut] || COULEURS.inconnu;
    return L.divIcon({ className: "marqueur", iconSize: [34, 34], iconAnchor: [17, 17],
      html: `<div style="background:${c}">${p.libres ?? "–"}</div>` });
  }
  function popup(p) {
    const c = COULEURS[p.statut] || COULEURS.inconnu;
    return `<div class="popup-nom">${esc(p.nom)}</div>
      <div class="popup-libres" style="color:${c}">${p.libres ?? "–"} / ${p.capacite ?? "?"} places libres</div>`;
  }
  function recadrer() {
    const pts = Object.entries(marqueurs).filter(([id]) => visible(data[id])).map(([, m]) => m.getLatLng());
    if (pts.length === 1) carte.setView(pts[0], 16);
    if (pts.length > 1) carte.fitBounds(pts, { padding: [30, 30], maxZoom: 16 });
  }
  function majCarte(p) {
    if (p.lat == null || p.lon == null) return;
    let m = marqueurs[p.id], nouveau = !m;
    if (nouveau) m = marqueurs[p.id] = L.marker([p.lat, p.lon], { icon: icone(p) }).bindPopup(popup(p));
    else { m.setIcon(icone(p)); m.setPopupContent(popup(p)); }
    if (visible(p)) m.addTo(carte); else m.remove();
    if (nouveau && visible(p)) recadrerBientot();
  }
  let minuteur;
  function recadrerBientot() { clearTimeout(minuteur); minuteur = setTimeout(recadrer, 300); }

  function majOnglets() {
    if (villeFixe) return;
    const villes = [...new Set(Object.values(data).map((p) => p.ville).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));
    const el = document.getElementById("onglets");
    if (villes.length < 2) { el.innerHTML = ""; return; }
    el.innerHTML = [["", "Toutes"], ...villes.map((v) => [v, v])].map(([v, t]) =>
      `<button type="button" data-ville="${esc(v)}" class="${norm(v) === norm(villeChoisie) ? "actif" : ""}">${esc(t)}</button>`).join("");
  }
  document.getElementById("onglets").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-ville]");
    if (!b) return;
    villeChoisie = b.dataset.ville;
    for (const p of Object.values(data)) majCarte(p);
    majOnglets(); majListe(); recadrer();
  });

  function majListe() {
    const liste = Object.values(data).filter(visible)
      .sort((a, b) => String(a.ville).localeCompare(String(b.ville), "fr") || String(a.nom).localeCompare(String(b.nom), "fr"));
    const plusieursVilles = new Set(liste.map((p) => p.ville)).size > 1;
    document.getElementById("lignes").innerHTML = liste.length ? liste.map((p) => `
      <tr class="${classe(p.statut)}" data-id="${esc(p.id)}">
        <td class="ml-name"><span class="pastille"></span>${esc(p.nom)}${plusieursVilles && p.ville ? `<span class="ml-ville">${esc(p.ville)}</span>` : ""}</td>
        <td>${p.capacite ?? "–"}</td>
        <td class="ml-libres">${p.libres ?? "–"}${p.statut === "complet" ? " (complet)" : ""}</td>
      </tr>`).join("") : `<tr><td colspan="3">Aucun parking pour cette ville.</td></tr>`;
    // sources, avec lien (obligatoire pour Berne)
    const sources = new Map();
    for (const p of liste) if (p.source) sources.set(p.source, p.sourceLien);
    const txt = [...sources].map(([s, l]) => l ? `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(s)}</a>` : esc(s)).join(", ");
    document.getElementById("maj").innerHTML = "En direct — mis à jour à " + new Date().toLocaleTimeString("fr-CH") + (txt ? " — Sources : " + txt : "");
  }

  // clic sur une ligne : la carte va au parking
  document.getElementById("lignes").addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-id]");
    const m = tr && marqueurs[tr.dataset.id];
    if (m) { carte.setView(m.getLatLng(), 17); m.openPopup(); document.getElementById("carte").scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  });

  const es = new EventSource("/api/stream");
  es.onmessage = (e) => {
    const p = JSON.parse(e.data);
    const nouvelleVille = !Object.values(data).some((x) => x.ville === p.ville);
    data[p.id] = p;
    majCarte(p);
    majListe();
    if (nouvelleVille) majOnglets();
  };
  es.onerror = () => { document.getElementById("maj").textContent = "Connexion perdue, reconnexion…"; };
</script>
</body>
</html>
